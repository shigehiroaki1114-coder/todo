<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo リスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>ToDo</h1>

    <form id="new-form" class="new-form" autocomplete="off">
      <input id="new-input" type="text" placeholder="やることを入力して Enter" aria-label="新しいタスク" maxlength="200">
      <button type="submit">追加</button>
    </form>

    <section id="main" class="main" hidden>
      <label class="toggle-all"><input type="checkbox" id="toggle-all"> すべて完了にする</label>
      <ul id="list" class="list"></ul>
    </section>

    <footer id="footer" class="footer" hidden>
      <span id="count"></span>
      <nav class="filters" aria-label="表示の切り替え">
        <button type="button" data-filter="all">すべて</button>
        <button type="button" data-filter="active">未完了</button>
        <button type="button" data-filter="done">完了</button>
      </nav>
      <button type="button" id="clear-done" class="link">完了済みを削除</button>
    </footer>

    <p class="hint">ダブルクリックまたは ✎ で編集（Enter で確定、Esc で取消）</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
